name: Build

# Compiles the add-in, the Center settings app, and the installer with the C# compiler
# that ships with Windows (no .NET SDK or Visual Studio needed - see src/build.ps1).
# Catches anything that wouldn't compile before it reaches a release.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./src/build.ps1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: OfficeTabsLite-build
          path: |
            dist/OfficeTabsLite-Setup.exe
            build/OfficeTabsLite.dll
            build/OfficeTabsLite-Center.exe
          retention-days: 14
